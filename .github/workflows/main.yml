name: Build ID Space APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check application files
        run: |
          test -f index.html || {
            echo "ERROR: index.html tidak ditemukan"
            exit 1
          }
          test -f app_icon1.png || {
            echo "ERROR: app_icon1.png tidak ditemukan"
            exit 1
          }

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          accept-android-sdk-licenses: true

      - name: Prepare Capacitor
        run: |
          mkdir -p www
          cp index.html www/index.html

          cat > package.json <<'JSON'
          {
            "name": "id-space-couple",
            "version": "1.0.0",
            "private": true,
            "dependencies": {
              "@capacitor/android": "^7.4.3",
              "@capacitor/core": "^7.4.3"
            },
            "devDependencies": {
              "@capacitor/cli": "^7.4.3"
            }
          }
          JSON

          npm install

          if [ ! -f capacitor.config.json ] && \
             [ ! -f capacitor.config.ts ] && \
             [ ! -f capacitor.config.js ]; then
            npx cap init "ID Space" "com.idspace.couple" --web-dir=www
          fi

          if [ ! -d android ]; then
            npx cap add android
          fi

          npx cap sync android
          
      - name: Set Android App Icon
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick

          test -f app_icon1.png || {
            echo "app_icon1.png tidak ditemukan"
            exit 1
          }

          mkdir -p /tmp/idspace-icons
          for size in 48 72 96 144 192; do
            convert app_icon1.png \
              -resize ${size}x${size} \
              /tmp/idspace-icons/icon-${size}.png
          done

          python3 - <<'PY'
          import os, shutil
          from pathlib import Path

          root = Path("android/app/src/main/res")
          sizes = {
              "48": "mipmap-mdpi",
              "72": "mipmap-hdpi",
              "96": "mipmap-xhdpi",
              "144": "mipmap-xxhdpi",
              "192": "mipmap-xxxhdpi",
          }

          for size, folder in sizes.items():
              dest = root / folder
              dest.mkdir(parents=True, exist_ok=True)
              src = Path("/tmp/idspace-icons") / f"icon-{size}.png"
              shutil.copy2(src, dest / "ic_launcher.png")
              shutil.copy2(src, dest / "ic_launcher_round.png")
          PY

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ID-Space-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
