name: Build ID Space APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check application files
        run: |
          test -f index.html || {
            echo "ERROR: index.html tidak ditemukan"
            exit 1
          }
          test -f app_icon1.png || {
            echo "ERROR: app_icon1.png tidak ditemukan"
            exit 1
          }

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: |
            platform-tools
            platforms;android-35
            build-tools;35.0.0
          accept-android-sdk-licenses: true

      - name: Prepare Capacitor
        run: |
          mkdir -p www
          cp index.html www/index.html

          cat > package.json <<'JSON'
          {
            "name": "id-space-couple",
            "version": "1.0.0",
            "private": true,
            "dependencies": {
              "@capacitor/android": "^7.4.3",
              "@capacitor/core": "^7.4.3"
            },
            "devDependencies": {
              "@capacitor/cli": "^7.4.3"
            }
          }
          JSON

          npm install

          if [ ! -f capacitor.config.json ] && \
             [ ! -f capacitor.config.ts ] && \
             [ ! -f capacitor.config.js ]; then
            npx cap init "ID Space" "com.idspace.couple" --web-dir=www
          fi

          if [ ! -d android ]; then
            npx cap add android
          fi

          npx cap sync android

      - name: Apply Couple App Icon
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick

          RES="android/app/src/main/res"

          mkdir -p "$RES/drawable-nodpi"

          convert app_icon1.png \
            -resize 324x324 \
            -gravity center \
            -background none \
            -extent 432x432 \
            "$RES/drawable-nodpi/idspace_launcher_foreground.png"

          for item in "48 mipmap-mdpi" \
                      "72 mipmap-hdpi" \
                      "96 mipmap-xhdpi" \
                      "144 mipmap-xxhdpi" \
                      "192 mipmap-xxxhdpi"; do
            set -- $item
            size="$1"
            folder="$2"

            mkdir -p "$RES/$folder"

            convert app_icon1.png \
              -resize "${size}x${size}" \
              "$RES/$folder/ic_launcher.png"

            cp "$RES/$folder/ic_launcher.png" \
              "$RES/$folder/ic_launcher_round.png"
          done

          mkdir -p "$RES/mipmap-anydpi-v26"

          cat > "$RES/mipmap-anydpi-v26/ic_launcher.xml" <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@android:color/white"/>
              <foreground android:drawable="@drawable/idspace_launcher_foreground"/>
          </adaptive-icon>
          XML

          cat > "$RES/mipmap-anydpi-v26/ic_launcher_round.xml" <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@android:color/white"/>
              <foreground android:drawable="@drawable/idspace_launcher_foreground"/>
          </adaptive-icon>
          XML

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ID-Space-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
