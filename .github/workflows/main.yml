name: Build ID Space APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check application files
        run: |
          test -f index.html || {
            echo "index.html tidak ditemukan"
            exit 1
          }
          test -f app_icon1.png || {
            echo "app_icon1.png tidak ditemukan"
            exit 1
          }

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Prepare Capacitor
        run: |
          mkdir -p www assets
          cp index.html www/index.html
          cp app_icon1.png assets/icon.png
          cp app_icon1.png assets/splash.png

          cat > package.json <<'JSON'
          {
            "name": "id-space-couple",
            "version": "1.0.0",
            "private": true,
            "dependencies": {
              "@capacitor/android": "^7.4.3",
              "@capacitor/core": "^7.4.3"
            },
            "devDependencies": {
              "@capacitor/cli": "^7.4.3",
              "@capacitor/assets": "^3.0.5"
            }
          }
          JSON

          npm install

          if [ ! -f capacitor.config.json ]; then
            npx cap init "ID Space" "com.idspace.couple" --web-dir=www
          fi

          npx cap add android
          npx cap sync android
          npx capacitor-assets generate --android
          npx cap sync android

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ID-Space-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
